<!doctype html>
<!-- Картинка для превью ссылки (Open Graph, 1200×630). Пересобрать: node scripts/make-og-image.mjs -->
<html><head><meta charset="utf-8"><style>
body{margin:0;width:1200px;height:630px;font-family:"Noto Sans","Noto Sans Armenian",system-ui,sans-serif;
background:linear-gradient(135deg,#4F46E5 0%,#312E81 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 80px;box-sizing:border-box}
h1{font-size:64px;line-height:1.1;margin:0 0 20px;font-weight:800;letter-spacing:-1px}
p{font-size:30px;margin:0 0 44px;color:#E0E7FF}

.team img{width:96px;height:96px;border-radius:50%;border:4px solid rgba(255,255,255,.9)}
.check{margin-left:22px;display:flex;align-items:center;gap:12px;background:#DCFCE7;color:#166534;font-size:26px;font-weight:700;padding:14px 22px;border-radius:16px}
.hy{position:absolute;bottom:40px;left:80px;font-size:24px;color:#C7D2FE}

<h1>Продвижение в соцсетях<br>с AI-командой</h1>
<p>Посты · Сторис · Рилсы · Реклама — Ереван</p>
<div class="team">
<img src="../apps/mobile/assets/agents/smm.svg"><img src="../apps/mobile/assets/agents/designer.svg"><img src="../apps/mobile/assets/agents/scriptwriter.svg"><img src="../apps/mobile/assets/agents/targetologist.svg"><img src="../apps/mobile/assets/agents/seo.svg">
<div class="check">✓ Менеджер проверяет каждую работу</div>
</div>
<div class="hy">Առաջխաղացում սոցցանցերում AI թիմով</div>
</body></html>
