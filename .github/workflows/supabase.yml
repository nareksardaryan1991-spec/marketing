# Сервер в Supabase: проверки базы, затем миграции и серверные функции при обновлении main.
# Первый запуск и ключи сервисов — один раз через ./scripts/setup.sh.
# Нужны (Settings → Secrets and variables → Actions):
#   секреты SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens) и SUPABASE_DB_PASSWORD,
#   переменная SUPABASE_PROJECT_REF.
# Пока их нет, выполняются только проверки.
name: Сервер

on:
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Проверки базы
        working-directory: supabase/tests
        run: npm install && npm test && npm run test:seed
      - name: Типы серверных функций
        working-directory: supabase/functions
        run: npx --yes deno@2 check */index.ts

  deploy:
    needs: test
    if: vars.SUPABASE_PROJECT_REF != ''
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npx --yes supabase@2 link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - run: npx --yes supabase@2 db push
      - run: npx --yes supabase@2 functions deploy
